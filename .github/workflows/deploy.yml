# Deploy workflow for plumline.online (GitHub Pages).
#
# It ties production to a known-good commit, per the deployment diagnosis:
#   1. Runs the full test battery (engine/run_all.js). A red build never deploys.
#   2. Stamps build-info.json with the commit SHA, timestamp and test count.
#   3. Writes assets/hashes.txt with a SHA-256 of every served file.
#   4. Deploys the site to GitHub Pages.
#   5. Smoke-tests the live site: build-info.json reports THIS commit, and a
#      couple of content markers that must exist in the current build are present.
#
# After a green run you can state: "production corresponds to commit <SHA>,
# that commit passed N tests, and the served files match assets/hashes.txt."

name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'

      # actions/setup-node can silently fall back to the runner's preinstalled
      # Node if the requested version fails to download. Assert the exact version.
      - name: Assert Node version
        run: |
          node -e "if(process.version!=='v24.15.0'){console.error('Expected Node v24.15.0, got '+process.version);process.exit(1)}console.log('Node version verified:',process.version)"

      # 1. Install deps.
      - name: Install deps
        run: npm ci

      - name: Verify jsdom loads
        run: node -e "require('jsdom'); console.log('jsdom loaded')"

      # 2. Full verify gate, run ONCE. npm run verify runs the test battery
      #    (public build), HTML/JSON-LD validity, the Vite multipage build into
      #    dist/, dist validation (public-only, engine markers, asset URLs), and
      #    the over-HTTP checks (pages 200, internals 404, zero broken links,
      #    Worker markers served). The test count is taken from the same run's log
      #    (via tee) instead of running the battery a second time.
      #    This is the SAME command developers run locally, so local == CI.
      - name: Verify (tests + build + validate dist)
        id: verify
        env:
          CI: "true"
          PLUMLINE_PUBLIC_BUILD: "1"
        run: |
          set -o pipefail
          npm run verify | tee verify.log
          COUNT=$(grep -oE 'TOTAL PASSED: [0-9]+' verify.log | grep -oE '[0-9]+' | head -1)
          if [ -z "$COUNT" ] || [ "$COUNT" -le 0 ]; then
            echo "Could not extract a positive test count from verify.log"; exit 1
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      # 3. Stamp dist/build-info.json with the real commit, time and test count.
      #    build-info is generated by the build (placeholder), stamped here.
      - name: Stamp build info in dist
        run: |
          node -e '
            const fs = require("fs");
            fs.writeFileSync("dist/build-info.json", JSON.stringify({
              commit: process.env.GITHUB_SHA,
              branch: process.env.GITHUB_REF_NAME || "",
              builtAt: new Date().toISOString(),
              testsPassed: Number(process.env.TEST_COUNT || 0),
              buildSystem: "vite",
              hosting: "GitHub Pages",
              note: "Stamped by CI at deploy time."
            }, null, 2) + "\n");
          '
        env:
          TEST_COUNT: ${{ steps.verify.outputs.count }}

      # 4. Record a SHA-256 of every file that will actually be served, over the
      #    FINAL dist/ (after stamping). Exclude hashes.txt itself so it never
      #    hashes its own contents.
      - name: Write file hashes
        run: |
          (
            cd dist &&
            find . -type f ! -path './assets/hashes.txt' -print0 |
            sort -z |
            xargs -0 sha256sum
          ) > dist/assets/hashes.txt
          echo "Hashed $(wc -l < dist/assets/hashes.txt) served files"

      # 5. Fail the BUILD if the artifact still carries the DEV-LOCAL placeholder
      #    or a mismatched commit — never upload an unstamped artifact.
      - name: Verify build-info was stamped
        run: |
          COMMIT=$(node -e 'process.stdout.write(require("./dist/build-info.json").commit||"")')
          if [ "$COMMIT" = "DEV-LOCAL" ] || [ -z "$COMMIT" ]; then
            echo "dist/build-info.json is not stamped (commit='$COMMIT'). Stamp step failed."
            exit 1
          fi
          if [ "$COMMIT" != "$GITHUB_SHA" ]; then
            echo "dist/build-info.json commit '$COMMIT' does not match GITHUB_SHA '$GITHUB_SHA'."
            exit 1
          fi
          echo "Artifact dist/build-info.json is stamped with $COMMIT."

      # 6. Guard: dist/ must not carry internal files (engine, tests, package
      #    manifests, node_modules, .github, docs, config). This is the artifact
      #    that gets published, so assert it here too, not only in validate_dist.
      - name: Assert dist has no internal files
        run: |
          for p in engine node_modules package.json package-lock.json vite.config.mjs docs .github data; do
            if [ -e "dist/$p" ]; then echo "Internal path leaked into dist: $p"; exit 1; fi
          done
          echo "dist/ carries only public files."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 5. Post-deploy smoke test against the live site, with retries for the
      #    GitHub Pages CDN cache (a fresh deploy can take a couple of minutes
      #    to propagate).
      - name: Smoke test production
        run: |
          set -e
          BASE="https://plumline.online"
          # One cache-buster for the whole run, so every resource is fetched
          # fresh from THIS deploy — never a mix of new build-info.json and
          # stale HTML/hashes that happen to agree with each other.
          CB="${GITHUB_SHA}-${RANDOM}"
          FETCH="curl -LfsS -H Cache-Control:no-cache"

          # Print what the domain serves RIGHT NOW, before any waiting — so the
          # very first log lines show whether we're getting this build, an old
          # build, or the DEV-LOCAL placeholder. Also show where the domain
          # resolves and whether GitHub's Pages headers are present, which
          # distinguishes "wrong Pages source" from "wrong DNS/hosting".
          echo "=== Pre-flight: what is $BASE serving right now? ==="
          echo "--- HTTP headers for /build-info.json ---"
          curl -sSI "$BASE/build-info.json?cb=$CB-pre" | grep -iE '^(HTTP/|server|x-github|via|age|cache|last-modified)' || true
          echo "--- Body of /build-info.json ---"
          curl -LsS "$BASE/build-info.json?cb=$CB-pre" || true
          echo ""
          echo "Expected commit for this run: $GITHUB_SHA"
          echo "=== end pre-flight ==="

          # Wait until production reports THIS commit. GitHub Pages CDN
          # propagation after a deploy is variable and can exceed 3 minutes, so
          # give it a generous budget (initial settle + up to ~8 min of polling)
          # rather than failing a good deploy that simply hadn't propagated yet.
          echo "Letting the Pages CDN settle briefly ..."
          sleep 20
          echo "Waiting for production to report $GITHUB_SHA ..."
          DEPLOYED=""
          for i in $(seq 1 32); do
            DEPLOYED=$($FETCH "$BASE/build-info.json?cb=$CB-$i" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).commit||"")}catch(e){}})' || true)
            if [ "$DEPLOYED" = "$GITHUB_SHA" ]; then echo "Production is on the expected commit (attempt $i)."; break; fi
            echo "  attempt $i/32: production reports '$DEPLOYED', retrying in 15s"
            sleep 15
          done
          if [ "$DEPLOYED" != "$GITHUB_SHA" ]; then
            echo "MISMATCH: production served commit '$DEPLOYED', expected '$GITHUB_SHA' after ~8 min of polling."
            echo ""
            if [ "$DEPLOYED" = "DEV-LOCAL" ]; then
              echo "Production is serving the UNSTAMPED placeholder (DEV-LOCAL)."
              echo "The build job already verified the uploaded artifact WAS stamped,"
              echo "so the artifact is correct. Serving DEV-LOCAL almost always means"
              echo "GitHub Pages is NOT serving this workflow's artifact:"
              echo "  -> Settings -> Pages -> Build and deployment -> Source must be"
              echo "     'GitHub Actions', NOT 'Deploy from a branch'."
              echo "  A branch source publishes the committed build-info.json (DEV-LOCAL)"
              echo "  and ignores the Actions artifact entirely."
              echo "Fix the Source setting, then re-run this workflow."
              exit 1
            fi
            echo "This check only proves the served build-info.json did not report the"
            echo "expected commit in time. It does NOT identify which of these it was:"
            echo "  - slow GitHub Pages CDN propagation (re-running this job often clears it)"
            echo "  - the deploy published a different artifact than this build"
            echo "  - the custom domain (plumline.online) points somewhere else or lagged"
            echo "  - a CDN/edge cache is still serving an older copy"
            echo "To diagnose: check the deploy job's published artifact and the value of"
            echo "commit in the live /build-info.json, then compare against '$GITHUB_SHA'."
            exit 1
          fi

          # Download everything ONCE to /tmp with the same cache-buster, then
          # analyse the files on disk (so every check sees the same bytes, from
          # the same CDN response — never a mix of fresh and stale resources).
          mkdir -p /tmp/prod
          for rel in build-info.json index.html solver.html guide.html about.html privacy.html terms.html examples.html capabilities.html assets/i18n.js assets/hashes.txt google78ab86ec8c8a0812.html; do
            mkdir -p "/tmp/prod/$(dirname "$rel")"
            $FETCH "$BASE/$rel?cb=$CB" -o "/tmp/prod/$rel"
          done

          # The Google Search Console verification file must be served and match
          # the repo copy byte-for-byte (losing it de-verifies the domain).
          if ! diff -q google78ab86ec8c8a0812.html /tmp/prod/google78ab86ec8c8a0812.html >/dev/null; then
            echo "google78ab86ec8c8a0812.html served content differs from repo (or is missing)"; exit 1
          fi
          echo "  google78ab86ec8c8a0812.html -> served and byte-identical (good)"

          # Re-confirm the commit from the SAME download used for the hash check,
          # so build-info, the manifest and the files all come from one fetch.
          FINAL_DEPLOYED=$(node -e 'process.stdout.write((require("/tmp/prod/build-info.json").commit)||"")')
          if [ "$FINAL_DEPLOYED" != "$GITHUB_SHA" ]; then
            echo "Downloaded build-info.json reports '$FINAL_DEPLOYED', expected '$GITHUB_SHA'"; exit 1
          fi

          # Content markers that must exist in the current build.
          grep -q 'id="capabilities"' /tmp/prod/index.html || { echo "index.html missing #capabilities"; exit 1; }
          grep -q 'gDirH' /tmp/prod/assets/i18n.js || { echo "i18n.js missing gDirH"; exit 1; }
          # The generated capabilities page must be live and carry a public
          # capability anchor (proves the per-group page actually deployed).
          grep -q 'id="cap-model-continuous"' /tmp/prod/capabilities.html || { echo "capabilities.html missing #cap-model-continuous"; exit 1; }

          # JSON-LD on production must actually PARSE (not merely be present).
          # Check examples.html (ItemList), index.html and capabilities.html
          # (SoftwareApplication with the inventory-derived featureList).
          echo "Parsing production JSON-LD ..."
          node -e '
            const fs=require("fs");
            const files=["examples.html","index.html","capabilities.html"];
            let total=0;
            for(const f of files){
              const s=fs.readFileSync("/tmp/prod/"+f,"utf8");
              const blocks=[...s.matchAll(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/g)];
              if(!blocks.length){ console.error(f+": no JSON-LD found"); process.exit(1); }
              blocks.forEach((m,i)=>{ try{ JSON.parse(m[1]); }catch(e){ console.error(f+" block "+(i+1)+" invalid: "+e.message); process.exit(1); } });
              total+=blocks.length;
            }
            console.log("  "+total+" JSON-LD block(s) across "+files.length+" pages parsed OK");'

          # Internal / dev-only files must never be published. Use the SINGLE
          # source of truth (engine/internal-paths.js), the same list validate_dist
          # and test_dist_http use, so the three can never drift. Note the real
          # path .github/workflows/deploy.yml (not workflows/deploy.yml).
          echo "Checking internal files are not served (single source of truth) ..."
          INTERNALS=$(node -e 'console.log(require("./engine/internal-paths.js").INTERNAL_PATHS.join(" "))')
          for path in $INTERNALS; do
            CODE=$(curl -L -sS -o /dev/null -w '%{http_code}' "$BASE/$path?cb=$CB")
            if [ "$CODE" != "404" ]; then echo "Expected /$path to return 404, got $CODE"; exit 1; fi
            echo "  /$path -> 404 (not served, good)"
          done

          # Crawl every internal href/src across the served pages and require 200
          # (this is the real "zero 404" check — HTTP, not disk existence).
          echo "Crawling internal links for 404s ..."
          node -e '
            const fs=require("fs");
            const pages=["index.html","solver.html","guide.html","about.html","privacy.html","terms.html","examples.html","capabilities.html"];
            const base="'"$BASE"'";
            const cb="'"$CB"'";
            const targets=new Set();
            // One normaliser for every target: skip external/non-page URLs, and
            // strip both the #fragment and the ?query so a script referenced as
            // nav-menu.js (from <script src>) and nav-menu.js?v=5 (from the
            // general src scan) collapse to a single entry — no duplicate fetch.
            function addTarget(u){
              if(!u) return;
              if(/^(https?:|mailto:|tel:|\/\/|data:|#)/.test(u)) return;
              u=u.replace(/^\.\//,"").split("#")[0].split("?")[0];
              if(u) targets.add(u);
            }
            for(const p of pages){
              const raw=fs.readFileSync("/tmp/prod/"+p,"utf8");
              // Collect <script src> assets BEFORE stripping, so external JS
              // (nav-menu.js, i18n.js, build-badge.js, examples-data.js) is
              // crawled for 404s too.
              for(const m of raw.matchAll(/<script\b[^>]*\bsrc="([^"]+)"/g)) addTarget(m[1]);
              // Strip only INLINE scripts (no src) before scanning href/src, so
              // JS string literals inside them are not mistaken for links.
              const s=raw.replace(/<script\b(?![^>]*\bsrc=)[\s\S]*?<\/script>/g,"");
              for(const m of s.matchAll(/(?:href|src)="([^"]+)"/g)) addTarget(m[1]);
            }
            (async()=>{
              let bad=0;
              for(const t of targets){
                const url=base+"/"+t+(t.indexOf("?")>=0?"&":"?")+"cb="+cb;
                const res=await fetch(url,{redirect:"manual"});
                if(res.status!==200){ console.error("  "+res.status+"  "+t); bad++; }
              }
              if(bad){ console.error(bad+" internal target(s) not 200"); process.exit(1); }
              console.log("  all "+targets.size+" internal targets return 200");
            })();
          ' || { echo "internal link crawl failed"; exit 1; }

          # 6. Verify EVERY file listed in the published manifest, AND that every
          #    file we EXPECT to be public is present in the manifest. Two claims:
          #    (a) every manifest entry was downloaded from production and matched
          #        its SHA-256; and
          #    (b) every expected public file (the 8 pages + root public files +
          #        every file under assets/, minus assets/hashes.txt) appears in the
          #        manifest — so a manifest that simply OMITS a public file fails.
          #    The expected list is built from the CHECKOUT: PUBLIC_PAGES and
          #    PUBLIC_FILES come from engine/internal-paths.js, and assets/ is walked
          #    recursively. Checkpoint A requires exact source↔dist asset parity, so
          #    the checkout's recursive list is the correct source of truth for what
          #    the published manifest must contain. Uses the SHARED module, same as
          #    the local dist HTTP test.
          echo "Verifying manifest: SHA-256 of every entry + presence of every expected public file ..."
          node -e '
            const fs=require("fs");
            const path=require("path");
            const { verifyManifest }=require("./engine/verify_manifest.js");
            const { PUBLIC_PAGES, PUBLIC_FILES }=require("./engine/internal-paths.js");
            const manifestText=fs.readFileSync("/tmp/prod/assets/hashes.txt","utf8");
            // Expected public paths from the checkout.
            const req=new Set();
            for(const p of PUBLIC_PAGES) req.add("./"+p);
            for(const f of PUBLIC_FILES) req.add("./"+f);           // includes CNAME, robots, sitemap, .nojekyll, google, build-info, the 6 runtime JS, plumline.css
            (function walk(d){
              for(const e of fs.readdirSync(d,{withFileTypes:true})){
                const full=path.join(d,e.name);
                if(e.isDirectory()){ walk(full); continue; }
                const rel="./"+path.relative(".",full).split(path.sep).join("/");
                if(rel==="./assets/hashes.txt") return;             // never expected in its own manifest
                req.add(rel);
              }
            })("assets");
            const requiredPaths=[...req];
            verifyManifest({ base:"'"$BASE"'", cb:"'"$CB"'", fetchImpl:fetch, manifestText, requiredPaths })
              .then(({checked})=>console.log("  verified "+checked+" manifest entries; all "+requiredPaths.length+" expected public files present and SHA-256-matched"))
              .catch(e=>{ console.error("  "+e.message); process.exit(1); });
          ' || { echo "manifest verification failed"; exit 1; }

          # solver.html must be in the manifest (guard against a future change that
          # drops it) and must carry this round's engine markers.
          FAILED=0
          if ! grep -q '^[0-9a-f]\{64\}  ./solver.html$' /tmp/prod/assets/hashes.txt; then
            echo "  solver.html missing from hashes.txt manifest"; FAILED=1; fi
          for marker in 'function parseCriterionOperand_' 'function showEngineTrouble' 'limitDependsOnVariable' 'function clipFeasibleToBox_' 'function normalizeConstraint_' 'function geometryEpsilon_' 'function detectLocale_' 'class="region-ray'; do
            if ! grep -q "$marker" /tmp/prod/solver.html; then
              echo "  served solver.html is missing marker: $marker"; FAILED=1; fi
          done
          [ "$FAILED" = "0" ] || { echo "solver.html manifest/marker check failed"; exit 1; }

          echo "Smoke test passed: production = $GITHUB_SHA, build-info + JSON-LD consistent, EVERY file in hashes.txt downloaded and matched its SHA-256, solver markers present, internal files 404."
