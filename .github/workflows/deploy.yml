# Deploy workflow for plumline.online (GitHub Pages).
#
# It ties production to a known-good commit, per the deployment diagnosis:
#   1. Runs the full test battery (engine/run_all.js). A red build never deploys.
#   2. Stamps build-info.json with the commit SHA, timestamp and test count.
#   3. Writes assets/hashes.txt with a SHA-256 of every served file.
#   4. Deploys the site to GitHub Pages.
#   5. Smoke-tests the live site: build-info.json reports THIS commit, and a
#      couple of content markers that must exist in the current build are present.
#
# After a green run you can state: "production corresponds to commit <SHA>,
# that commit passed N tests, and the served files match assets/hashes.txt."

name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1. Full test battery — the job fails here if anything is red.
      - name: Install test deps
        run: npm install jsdom --no-save

      - name: Run tests
        id: tests
        run: |
          OUT=$(node engine/run_all.js)
          echo "$OUT"
          COUNT=$(echo "$OUT" | grep -oE 'TOTAL PASSED: [0-9]+' | grep -oE '[0-9]+')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      # Extra guard: i18n.js must parse, and every JSON-LD block must be valid.
      - name: Validate assets
        run: |
          node --check assets/i18n.js
          node engine/tests_jsonld.js
          node engine/tests_i18n_pages.js

      # 2. Stamp build-info.json with the real commit, time and test count.
      - name: Stamp build info
        run: |
          node -e '
            const fs = require("fs");
            fs.writeFileSync("build-info.json", JSON.stringify({
              commit: process.env.GITHUB_SHA,
              builtAt: new Date().toISOString(),
              testsPassed: Number(process.env.TEST_COUNT || 0),
              note: "Stamped by CI at deploy time."
            }, null, 2) + "\n");
          '
        env:
          TEST_COUNT: ${{ steps.tests.outputs.count }}

      # Build the served site into _site, excluding tests and dev-only files.
      # engine/ stays in the repo (CI needs it) but is never served.
      - name: Prepare served site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude '_site' \
            --exclude 'engine' --exclude 'DEPLOY.md' --exclude 'hashes.txt' \
            ./ _site/

      # 3. Record a SHA-256 of every file that will actually be served.
      #    Exclude hashes.txt itself so it never hashes its own (empty) contents.
      - name: Write file hashes
        run: |
          (
            cd _site &&
            find . -type f ! -path './assets/hashes.txt' -print0 |
            sort -z |
            xargs -0 sha256sum
          ) > _site/assets/hashes.txt
          echo "Hashed $(wc -l < _site/assets/hashes.txt) served files"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 5. Post-deploy smoke test against the live site, with retries for the
      #    GitHub Pages CDN cache (a fresh deploy can take a couple of minutes
      #    to propagate).
      - name: Smoke test production
        run: |
          set -e
          BASE="https://plumline.online"
          # One cache-buster for the whole run, so every resource is fetched
          # fresh from THIS deploy — never a mix of new build-info.json and
          # stale HTML/hashes that happen to agree with each other.
          CB="${GITHUB_SHA}-${RANDOM}"
          FETCH="curl -LfsS -H Cache-Control:no-cache"

          # Wait until production reports THIS commit (up to ~3 min).
          echo "Waiting for production to report $GITHUB_SHA ..."
          DEPLOYED=""
          for i in $(seq 1 18); do
            DEPLOYED=$($FETCH "$BASE/build-info.json?cb=$CB-$i" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).commit||"")}catch(e){}})' || true)
            if [ "$DEPLOYED" = "$GITHUB_SHA" ]; then echo "Production is on the expected commit."; break; fi
            echo "  attempt $i: production reports '$DEPLOYED', retrying in 10s"
            sleep 10
          done
          if [ "$DEPLOYED" != "$GITHUB_SHA" ]; then
            echo "MISMATCH: production serves '$DEPLOYED', expected '$GITHUB_SHA'"; exit 1
          fi

          # Download everything ONCE to /tmp with the same cache-buster, then
          # analyse the files on disk (so every check sees the same bytes, from
          # the same CDN response — never a mix of fresh and stale resources).
          mkdir -p /tmp/prod
          for rel in build-info.json index.html solver.html guide.html about.html privacy.html terms.html examples.html assets/i18n.js assets/hashes.txt; do
            mkdir -p "/tmp/prod/$(dirname "$rel")"
            $FETCH "$BASE/$rel?cb=$CB" -o "/tmp/prod/$rel"
          done

          # Re-confirm the commit from the SAME download used for the hash check,
          # so build-info, the manifest and the files all come from one fetch.
          FINAL_DEPLOYED=$(node -e 'process.stdout.write((require("/tmp/prod/build-info.json").commit)||"")')
          if [ "$FINAL_DEPLOYED" != "$GITHUB_SHA" ]; then
            echo "Downloaded build-info.json reports '$FINAL_DEPLOYED', expected '$GITHUB_SHA'"; exit 1
          fi

          # Content markers that must exist in the current build.
          grep -q 'id="capabilities"' /tmp/prod/index.html || { echo "index.html missing #capabilities"; exit 1; }
          grep -q 'gDirH' /tmp/prod/assets/i18n.js || { echo "i18n.js missing gDirH"; exit 1; }

          # JSON-LD on production must actually PARSE (not merely be present).
          echo "Parsing production JSON-LD ..."
          node -e '
            const fs=require("fs"); const s=fs.readFileSync("/tmp/prod/examples.html","utf8");
            const blocks=[...s.matchAll(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/g)];
            if(!blocks.length){ console.error("no JSON-LD found"); process.exit(1); }
            blocks.forEach((m,i)=>{ try{ JSON.parse(m[1]); }catch(e){ console.error("block "+(i+1)+" invalid: "+e.message); process.exit(1); } });
            console.log("  "+blocks.length+" JSON-LD block(s) parsed OK");'

          # The tests folder must return exactly 404 (repo-only, never served).
          echo "Checking /engine/ is not served ..."
          CODE=$(curl -L -sS -o /dev/null -w '%{http_code}' "$BASE/engine/run_all.js?cb=$CB")
          if [ "$CODE" != "404" ]; then echo "Expected /engine/run_all.js to return 404, got $CODE"; exit 1; fi
          echo "  /engine/run_all.js -> 404 (not served, good)"

          # Crawl every internal href/src across the served pages and require 200
          # (this is the real "zero 404" check — HTTP, not disk existence).
          echo "Crawling internal links for 404s ..."
          node -e '
            const fs=require("fs");
            const pages=["index.html","solver.html","guide.html","about.html","privacy.html","terms.html","examples.html"];
            const base="'"$BASE"'";
            const cb="'"$CB"'";
            const targets=new Set();
            for(const p of pages){
              const s=fs.readFileSync("/tmp/prod/"+p,"utf8").replace(/<script[\s\S]*?<\/script>/g,"");
              for(const m of s.matchAll(/(?:href|src)="([^"]+)"/g)){
                let u=m[1];
                if(/^(https?:|mailto:|tel:|\/\/|data:|#)/.test(u)) continue;
                u=u.split("#")[0]; if(!u) continue;
                targets.add(u);
              }
            }
            (async()=>{
              let bad=0;
              for(const t of targets){
                const url=base+"/"+t+(t.indexOf("?")>=0?"&":"?")+"cb="+cb;
                const res=await fetch(url,{redirect:"manual"});
                if(res.status!==200){ console.error("  "+res.status+"  "+t); bad++; }
              }
              if(bad){ console.error(bad+" internal target(s) not 200"); process.exit(1); }
              console.log("  all "+targets.size+" internal targets return 200");
            })();
          ' || { echo "internal link crawl failed"; exit 1; }

          # 6. Verify served files against the published hashes — build-info.json
          #    included, so a manifest from a different build fails here. Exact
          #    field match (awk $2 == path), no regex interpretation of dots.
          echo "Verifying served files against hashes.txt ..."
          FAILED=0
          for path in ./build-info.json ./index.html ./assets/i18n.js ./examples.html ./guide.html; do
            EXPECT=$(awk -v p="$path" '$2 == p { print $1 }' /tmp/prod/assets/hashes.txt)
            if [ -z "$EXPECT" ]; then echo "  no hash listed for $path"; FAILED=1; continue; fi
            ACTUAL=$(sha256sum "/tmp/prod/${path#./}" | awk '{print $1}')
            if [ "$EXPECT" != "$ACTUAL" ]; then echo "  HASH MISMATCH $path (expected $EXPECT got $ACTUAL)"; FAILED=1; else echo "  ok $path"; fi
          done
          [ "$FAILED" = "0" ] || { echo "served files do not match hashes.txt"; exit 1; }

          echo "Smoke test passed: production = $GITHUB_SHA, build-info + JSON-LD + hashes all consistent, engine/ 404."
